services:
  db:                          # the name you'll use in commands
    image: postgres:17         # pinned on purpose: most tutorials match 17's data path; 18 changed it
    environment:
      POSTGRES_DB: hackathon   # database created on first start
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: devpassword   # local dev only
    ports:
      - "127.0.0.1:5432:5432"            # your Mac's port : the container's port
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts

volumes:
  pgdata: